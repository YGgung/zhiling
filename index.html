function sget(k,d){try{var v=localStorage.getItem(NS+k);return v==null?d:JSON.parse(v);}catch(e){return k in mem?mem[k]:d;}}
function sset(k,v){mem[k]=v;try{localStorage.setItem(NS+k,JSON.stringify(v));}catch(e){}}
function sdel(k){delete mem[k];try{localStorage.removeItem(NS+k);}catch(e){}}

/* ---------- utils ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function ansIdx(q){return q.answer.split('').map(function(c){return LET.indexOf(c);}).sort();}
function sameSet(a,b){if(a.length!==b.length)return false;a=a.slice().sort();b=b.slice().sort();for(var i=0;i<a.length;i++)if(a[i]!==b[i])return false;return true;}
function isRight(q,sel){return sameSet(sel||[],ansIdx(q));}
function letters(q,sel,order){ // sel: original idx -> display letters
  order=order||[0,1,2,3];
  return (sel||[]).map(function(i){return LET[order.indexOf(i)];}).sort().join('');
}
function fmtTime(s){s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);}
function fmtDate(t){var d=new Date(t);return (d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);}
var toastT;function toast(msg){var el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el);}el.textContent=msg;el.style.display='block';clearTimeout(toastT);toastT=setTimeout(function(){el.style.display='none';},1600);}
function topicCls(t){return t;}

/* ---------- records ---------- */
function rec(){return sget('rec',{});}           // qid -> {s:[sel], ok:bool, v:viewed, t}
function setRec(qid,sel,ok,viewed){var r=rec();r[qid]={s:sel,ok:ok,v:!!viewed,t:Date.now()};sset('rec',r);
  if(!ok) addWrong(qid);}
function wrongs(){return sget('wrong',[]);}
function addWrong(id){var w=wrongs();if(w.indexOf(id)<0){w.push(id);sset('wrong',w);}}
function delWrong(id){sset('wrong',wrongs().filter(function(x){return x!==id;}));}
function favs(){return sget('fav',[]);}
function toggleFav(id){var f=favs();var i=f.indexOf(id);if(i<0)f.push(id);else f.splice(i,1);sset('fav',f);return i<0;}

window.addEventListener('hashchange',function(){view={};stopTimer();render();window.scrollTo(0,0);});

function bar(html){return '<div class="bar"><div class="bar-in">'+html+'</div></div>';}

/* ---------- question card ---------- */
// ctx: {q, order, sel(orig idx[]), revealed, viewed, interactive}
function qCard(ctx,head){
  var q=ctx.q,order=ctx.order||[0,1,2,3],ans=ansIdx(q),sel=ctx.sel||[];
  var h='<div class="card">';
  h+='<div class="q-meta">'+(head||'')+'<span class="badge '+(q.type==='multi'?'multi':'')+'">'+(q.type==='multi'?'多选':'单选')+'</span><span class="badge topic">'+esc(q.topic)+'</span></div>';
  h+='<p class="q-stem">'+esc(q.stem)+'</p>';
  order.forEach(function(oi,pos){
    var cls='opt'+(q.type==='multi'?' multi':'');
    if(ctx.revealed){
      var isA=ans.indexOf(oi)>=0,isS=sel.indexOf(oi)>=0;
      if(isA&&isS)cls+=' right';else if(isS&&!isA)cls+=' wrong';else if(isA)cls+=(sel.length||ctx.viewed?' right':' right');
    }else if(sel.indexOf(oi)>=0)cls+=' sel';
    h+='<button class="'+cls+'" '+(ctx.revealed||!ctx.interactive?'disabled':'data-act="pick" data-arg="'+oi+'"')+'><span class="k">'+LET[pos]+'</span><span>'+esc(q.options[oi])+'</span></button>';
  });
  if(ctx.revealed){
    var right=isRight(q,sel);var corr=letters(q,ans,order);
    var cls=ctx.viewed&&!sel.length?'view':(right?'ok':'bad');
    var title=ctx.viewed&&!sel.length?'正确答案：<b>'+corr+'</b>':(right?'回答正确':'回答错误　你选 '+(letters(q,sel,order)||'未选')+'，正确答案 <b>'+corr+'</b>');
    if(!right&&q.type==='multi'&&sel.length&&sel.every(function(i){return ans.indexOf(i)>=0;}))title='少选了　你选 '+letters(q,sel,order)+'，正确答案 <b>'+corr+'</b>';
    h+='<div class="verdict '+cls+'">'+title+(q.explain?'<div class="explain">'+esc(q.explain)+'<span class="src">出处：'+esc(q.source||'')+'</span></div>':'')+
       notes(q)+'</div>';
  }
  h+='</div>';
  return h;
}

function notes(q){return (q.fixnote?'<div class="fixnote">题库修订：'+esc(q.fixnote)+'</div>':'')+(q.check?'<div class="fixnote">待核：'+esc(q.check)+'</div>':'')+(q.caution?'<div class="src">提示：'+esc(q.caution)+'</div>':'');}
/* ---------- practice (sequential) ---------- */
function pFilter(){return sget('pFilter',{topics:[],type:''});}
function pList(){var f=pFilter();return Q.filter(function(q){return (!f.topics.length||f.topics.indexOf(q.topic)>=0)&&(!f.type||q.type===f.type);});}
function pKey(){var f=pFilter();return 'pPos.'+(f.topics.slice().sort().join(',')||'all')+'.'+(f.type||'all');}
function vPractice(){
  var list=pList();var f=pFilter();
  var pos=Math.min(sget(pKey(),0),Math.max(0,list.length-1));
  var h=top('练习模式','#/','<span class="tag">'+(list.length?(pos+1)+' / '+list.length:'0')+'</span>');
  h+='<div class="wrap">';
  h+='<div class="chips" style="margin-bottom:10px">'+TOPICS.map(function(t){return '<button class="chip'+(f.topics.indexOf(t)>=0?' on':'')+'" data-act="pTopic" data-arg="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+
     '<button class="chip'+(f.type==='single'?' on':'')+'" data-act="pType" data-arg="single">单选</button><button class="chip'+(f.type==='multi'?' on':'')+'" data-act="pType" data-arg="multi">多选</button>'+
     ((f.topics.length||f.type)?'<button class="link" data-act="pReset">一键重置</button>':'')+'</div>';
  if(!list.length){app.innerHTML=h+'<div class="empty">暂无数据</div></div>';return;}
  var q=list[pos];var r=rec()[q.id];
  var vs=view.p&&view.p.id===q.id?view.p:{id:q.id,sel:r?r.s.slice():[],revealed:!!r,viewed:r&&r.v};
  view.p=vs;
  h+='<div class="progress"><i style="width:'+((pos+1)/list.length*100)+'%"></i></div>';
  h+=qCard({q:q,sel:vs.sel,revealed:vs.revealed,viewed:vs.viewed,interactive:true},'<span>第 '+(pos+1)+' 题</span>');
  var fav=favs().indexOf(q.id)>=0;
  h+='<div class="row" style="margin-top:-2px">';
  if(!vs.revealed){
    if(q.type==='multi')h+='<button class="btn" data-act="pSubmit" '+(vs.sel.length?'':'disabled')+'>提交答案</button>';
    h+='<button class="btn ghost" data-act="pView">看答案</button>';
  }else h+='<button class="btn gray" data-act="pRedo">重做本题</button>';
  h+='<button class="btn gray'+(fav?' fav-on':'')+'" data-act="fav" data-arg="'+q.id+'">'+(fav?'已收藏':'收藏')+'</button></div>';
  h+='</div>';
  h+=bar('<button class="btn gray" data-act="pMove" data-arg="-1" '+(pos?'':'disabled')+'>上一题</button><button class="mid" data-act="pSheet">题号 ▴</button><button class="btn" data-act="pMove" data-arg="1" '+(pos<list.length-1?'':'disabled')+'>下一题</button>');
  app.innerHTML=h;
}
function pPick(oi){var vs=view.p,q=QBY[vs.id];if(vs.revealed)return;
  if(q.type==='single'){vs.sel=[oi];vs.revealed=true;setRec(q.id,vs.sel,isRight(q,vs.sel));}
  else{var i=vs.sel.indexOf(oi);if(i<0)vs.sel.push(oi);else vs.sel.splice(i,1);}
  render();
}

/* ---------- sheet (jump grid) ---------- */
function openSheet(html){closeSheet();var m=document.createElement('div');m.className='sheet-mask';m.innerHTML='<div class="sheet">'+html+'</div>';m.addEventListener('click',function(e){if(e.target===m)closeSheet();});document.body.appendChild(m);}
function closeSheet(){var m=document.querySelector('.sheet-mask');if(m)m.remove();}
function pSheet(){
  var list=pList(),r=rec(),pos=sget(pKey(),0);
  var h='<h3>题号</h3><div class="legend"><span><i style="background:var(--ok-bg);border:1px solid #A7DDB7"></i>答对</span><span><i style="background:var(--bad-bg);border:1px solid #F3B4AD"></i>答错或看了答案</span><span><i style="background:#fff;border:1px solid var(--line)"></i>未做</span></div><div class="grid">';
  list.forEach(function(q,i){var x=r[q.id];h+='<button class="cell'+(x?(x.ok?' r':' w'):'')+(i===pos?' cur':'')+'" data-act="pJump" data-arg="'+i+'">'+(i+1)+'</button>';});
  h+='</div><div style="margin-top:14px"><button class="btn gray block" data-act="pClear">清空练习记录</button></div>';
  openSheet(h);
}

/* ---------- random / book sessions ---------- */
function vRandomSetup(){
  var st=view.rs||(view.rs={topics:sget('rsTopics',[]),type:'',n:sget('rsN',20)});
  var pool=Q.filter(function(q){return (!st.topics.length||st.topics.indexOf(q.topic)>=0)&&(!st.type||q.type===st.type);});
  var h=top('随机模式','#/')+'<div class="wrap">';
  var ses=sget('ses.random',null);
  if(ses&&ses.idx<ses.ids.length)h+='<div class="infobox" style="margin-bottom:12px">上次还有一组没做完（'+Object.keys(ses.ans).length+'/'+ses.ids.length+'）。<button class="link" data-act="go" data-arg="#/random/run">继续上次</button></div>';
  h+='<div class="card"><div class="h4">方向（可多选，不选即全部）</div><div class="chips">'+TOPICS.map(function(t){return '<button class="chip'+(st.topics.indexOf(t)>=0?' on':'')+'" data-act="rsTopic" data-arg="'+esc(t)+'">'+esc(t)+'</button>';}).join('')+(st.topics.length?'<button class="link" data-act="rsReset">一键重置</button>':'')+'</div>';
  h+='<div class="h4" style="margin-top:14px">题型</div><div class="chips">'+[['','全部'],['single','单选'],['multi','多选']].map(function(x){return '<button class="chip'+(st.type===x[0]?' on':'')+'" data-act="rsType" data-arg="'+x[0]+'">'+x[1]+'</button>';}).join('')+'</div>';
  var n=Math.min(st.n,pool.length);
  h+='<div class="h4" style="margin-top:14px">本次题量（共 '+pool.length+' 题可抽）</div><div class="chips">'+[10,20,30,50].filter(function(x){return x<pool.length;}).map(function(x){return '<button class="chip'+(n===x?' on':'')+'" data-act="rsN" data-arg="'+x+'">'+x+' 题</button>';}).join('')+
     '<button class="chip'+(n===pool.length?' on':'')+'" data-act="rsN" data-arg="'+pool.length+'">全部</button></div>'+
     '<div style="margin-top:10px;font-size:14px;color:var(--ink-2)">自定义：<input type="number" min="1" max="'+pool.length+'" value="'+n+'" data-inp="rsN"> 题</div></div>';
  h+='<p class="note">每次开始都会重新打乱题目顺序和选项顺序；选完即揭晓对错，也可以直接看答案。</p></div>';
  h+=bar('<button class="btn" data-act="rsStart" '+(pool.length?'':'disabled')+'>开始练习（'+n+' 题）</button>');
  app.innerHTML=h;
}
function newSession(ids){var orders={};ids.forEach(function(id){orders[id]=shuffle([0,1,2,3]);});return {ids:ids,orders:orders,idx:0,ans:{},t:Date.now()};}
function vSession(kind){
  var key='ses.'+kind;var ses=sget(key,null);
  var title=kind==='random'?'随机模式':kind==='book-wrong'?'错题重练':'收藏练习';
  var back=kind==='random'?'#/random':'#/book/'+kind.slice(5);
  if(!ses||!ses.ids.length){app.innerHTML=top(title,back)+'<div class="empty">暂无数据</div>';return;}
  if(ses.idx>=ses.ids.length)return vSessionEnd(kind,ses,title,back);
  var id=ses.ids[ses.idx],q=QBY[id];if(!q){ses.idx++;sset(key,ses);return render();}
  var a=ses.ans[id]||{sel:[],revealed:false};
  view.s={kind:kind,key:key};
  var h=top(title,back,'<span class="tag">'+(ses.idx+1)+' / '+ses.ids.length+'</span>')+'<div class="wrap">';
  h+='<div class="progress"><i style="width:'+((ses.idx+1)/ses.ids.length*100)+'%"></i></div>';
  h+=qCard({q:q,order:ses.orders[id],sel:a.sel,revealed:a.revealed,viewed:a.viewed,interactive:true},'<span>第 '+(ses.idx+1)+' 题</span>');
  var fav=favs().indexOf(id)>=0;
  h+='<div class="row">';
  if(!a.revealed){if(q.type==='multi')h+='<button class="btn" data-act="sSubmit" '+(a.sel.length?'':'disabled')+'>提交答案</button>';h+='<button class="btn ghost" data-act="sView">看答案</button>';}
  h+='<button class="btn gray'+(fav?' fav-on':'')+'" data-act="fav" data-arg="'+id+'">'+(fav?'已收藏':'收藏')+'</button></div>';
  if(kind==='book-wrong'&&a.revealed&&isRight(q,a.sel))h+='<p class="note">答对了，这题已从错题本移出。</p>';
  h+='</div>';
  h+=bar('<button class="btn gray" data-act="sMove" data-arg="-1" '+(ses.idx?'':'disabled')+'>上一题</button><button class="mid" data-act="sQuit">结束</button><button class="btn" data-act="sMove" data-arg="1">'+(ses.idx<ses.ids.length-1?'下一题':'看结果')+'</button>');
  app.innerHTML=h;
}
function sAnswer(fn){var k=view.s.key;var ses=sget(k,null);var id=ses.ids[ses.idx],q=QBY[id];var a=ses.ans[id]||{sel:[],revealed:false};fn(a,q);ses.ans[id]=a;sset(k,ses);
  if(a.revealed&&!a.recorded){a.recorded=true;ses.ans[id]=a;sset(k,ses);var ok=!a.viewed&&isRight(q,a.sel);setRec(id,a.sel,ok,a.viewed);if(view.s.kind==='book-wrong'&&ok)delWrong(id);}
  render();}
function vSessionEnd(kind,ses,title,back){
  var ids=ses.ids,ok=0,wrong=[];
  ids.forEach(function(id){var a=ses.ans[id];if(a&&a.revealed&&!a.viewed&&isRight(QBY[id],a.sel))ok++;else wrong.push(id);});
  var h=top(title+' · 结果',back)+'<div class="wrap"><div class="card"><div class="big-score"><b>'+ok+'</b><span> / '+ids.length+' 题答对</span></div>'+
    '<div class="kv"><span>正确率</span><b>'+Math.round(ok/ids.length*100)+'%</b></div><div class="kv"><span>答错、没做或看了答案</span><b>'+wrong.length+' 题</b></div></div>';
  if(wrong.length){h+='<div class="sec-title">需要再看的题</div>'+wrong.map(function(id){return reviewItem(QBY[id],(ses.ans[id]||{}).sel||[],ses.orders[id],null);}).join('');}
  h+='</div>'+bar('<button class="btn gray" data-act="go" data-arg="#/">回首页</button>'+(kind==='random'?'<button class="btn" data-act="rsAgain">再来一组</button>':'<button class="btn" data-act="go" data-arg="'+back+'">返回列表</button>'));
  app.innerHTML=h;
}
function reviewItem(q,sel,order,pts){
  order=order||[0,1,2,3];var ans=ansIdx(q);
  var h='<div class="rv"><div class="rv-h"><span class="badge '+(q.type==='multi'?'multi':'')+'">'+(q.type==='multi'?'多选':'单选')+'</span><span class="badge topic">'+esc(q.topic)+'</span>'+(pts!=null?'<span class="pts '+(pts===10?'ok':pts>0?'half':'bad')+'">'+pts+' 分</span>':'')+'</div><div class="rv-s">'+esc(q.stem)+'</div>';
  order.forEach(function(oi,pos){var c=ans.indexOf(oi)>=0,s=sel.indexOf(oi)>=0;h+='<div class="rv-o'+(c?' c':s?' x':'')+'">'+LET[pos]+'. '+esc(q.options[oi])+(c&&s?'（你选对了）':c?'（正确答案）':s?'（你选的）':'')+'</div>';});
  h+='<div class="rv-a" style="margin-top:6px">你选 <b>'+(letters(q,sel,order)||'未作答')+'</b>，正确答案 <b>'+letters(q,ans,order)+'</b></div>';
  if(q.explain)h+='<div class="explain">'+esc(q.explain)+'<span class="src">出处：'+esc(q.source||'')+'</span></div>';
  h+=notes(q);
  return h+'</div>';
}

/* ---------- book ---------- */
function vBook(which){
  var ids=(which==='fav'?favs():wrongs()).filter(function(id){return QBY[id];});
  var title=which==='fav'?'收藏':'错题本';
  var h=top(title,'#/','<span class="tag">'+ids.length+' 题</span>')+'<div class="wrap">';
  if(which!=='fav')h+='<p class="note" style="margin-top:0">答错的题、点过「看答案」的题会自动进来；在「错题重练」里答对就移出。</p>';
  if(!ids.length){app.innerHTML=h+'<div class="empty">暂无数据</div></div>';return;}
  var r=rec();
  ids.slice().reverse().forEach(function(id){var q=QBY[id];var x=r[id];h+=reviewItem(q,x?x.s:[],null,null).replace('</div></div>','</div>'+'<div style="text-align:right;margin-top:4px"><button class="link" data-act="bookDel" data-arg="'+which+':'+id+'">移出</button></div></div>');});
  h+='</div>'+bar('<button class="btn gray" data-act="bookClear" data-arg="'+which+'">清空</button><button class="btn" data-act="bookRun" data-arg="'+which+'">'+(which==='fav'?'练习收藏题':'错题重练')+'（'+ids.length+'）</button>');
  app.innerHTML=h;
}

/* ---------- exam ---------- */
var timer=null;function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function vExamIntro(){
  var ses=sget('ses.exam',null);

  var plain=text.replace(/[A-Za-z]+[\d][A-Za-z\d\-]*/g,' ').replace(/\d{4}\s*年/g,' ');
  var nums=plain.match(/\d+(?:\.\d+)?\s*(?:%|个月|天|周|分钟|小时|mg|例|倍|万元|万)?/g)||[];
  nums.forEach(function(n){n=n.replace(/\s+/g,'');if(n.length<2&&!/[%天周]/.test(n))return;if(/^\d$/.test(n))return;var k=n;if(!seen[k]){seen[k]=1;out.push(k);}});
  TERMS.forEach(function(t){if(text.toUpperCase().indexOf(t.toUpperCase())>=0&&!seen[t]){var dup=out.some(function(o){return o.indexOf(t)>=0;});if(!dup){seen[t]=1;out.push(t);}}});
  return out.slice(0,10);
}
function kwBox(ref,mine){
  var ks=keyTerms(ref);if(!ks.length)return '';
  var M=mine.toUpperCase().replace(/\s+/g,'');
  var hit=0;var h='<div class="kw" style="align-self:flex-end;justify-content:flex-end">';
  ks.forEach(function(k){var num=k.match(/^\d+(?:\.\d+)?/);var probe=(num?num[0]:k).toUpperCase();var ok=M.indexOf(probe)>=0;if(ok)hit++;h+='<span class="'+(ok?'hit':'miss')+'">'+(ok?'已提到 ':'未提到 ')+esc(k)+'</span>';});
  return h+'<span class="hit" style="background:none;color:var(--ink-3)">关键词 '+hit+'/'+ks.length+'</span></div>';
}
function speak(text){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang='zh-CN';u.rate=1.05;speechSynthesis.speak(u);}catch(e){toast('这台设备不支持朗读');}}

/* ---------- events ---------- */
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  var act=el.getAttribute('data-act'),arg=el.getAttribute('data-arg');
  if(act==='dCheck'){var d=view.d;d.ck=d.ck||{};d.ck[arg]=el.checked;var c=CASES.filter(function(x){return x.no===d.no;})[0];var y=window.scrollY;render();window.scrollTo(0,y);return;}
  e.preventDefault();
  A[act]&&A[act](arg,el);
});
document.addEventListener('click',function(e){var el=e.target.closest('.sheet [data-act]');if(!el)return;e.preventDefault();var a=el.getAttribute('data-act');A[a]&&A[a](el.getAttribute('data-arg'),el);});
app.addEventListener('input',function(e){var k=e.target.getAttribute('data-inp');
  if(k==='rsN'){var v=parseInt(e.target.value,10);if(v>0){view.rs.n=v;sset('rsN',v);}}
  if(k==='dText'){view.d.draft=e.target.value;}
});
app.addEventListener('change',function(e){if(e.target.getAttribute('data-inp')==='rsN'){var y=window.scrollY;render();window.scrollTo(0,y);}});
var A={
  go:function(h){go(h);},
  back:function(h){if(h==='back'){if(history.length>1)history.back();else go('#/');}else go(h);},
  fav:function(id){var on=toggleFav(+id);toast(on?'已收藏':'已取消收藏');var y=window.scrollY;render();window.scrollTo(0,y);},
  pTopic:function(t){var f=pFilter();var i=f.topics.indexOf(t);if(i<0)f.topics.push(t);else f.topics.splice(i,1);sset('pFilter',f);view={};render();},
  pType:function(t){var f=pFilter();f.type=f.type===t?'':t;sset('pFilter',f);view={};render();},
  pReset:function(){sset('pFilter',{topics:[],type:''});view={};render();},
  pick:function(oi){oi=+oi;var r=parts()[0];if(r==='practice')pPick(oi);else if(r==='exam')ePick(oi);else sAnswer(function(a,q){if(a.revealed)return;if(q.type==='single'){a.sel=[oi];a.revealed=true;}else{var i=a.sel.indexOf(oi);if(i<0)a.sel.push(oi);else a.sel.splice(i,1);}});},
  pSubmit:function(){var vs=view.p,q=QBY[vs.id];vs.revealed=true;setRec(q.id,vs.sel,isRight(q,vs.sel));render();},
  pView:function(){var vs=view.p,q=QBY[vs.id];vs.revealed=true;vs.viewed=true;setRec(q.id,vs.sel,false,true);render();},
  pRedo:function(){var vs=view.p;vs.sel=[];vs.revealed=false;vs.viewed=false;var r=rec();delete r[vs.id];sset('rec',r);render();},
  pMove:function(d){var list=pList();var p=Math.max(0,Math.min(list.length-1,sget(pKey(),0)+(+d)));sset(pKey(),p);view.p=null;render();window.scrollTo(0,0);},
  pSheet:function(){pSheet();},
  pJump:function(i){sset(pKey(),+i);view.p=null;closeSheet();render();window.scrollTo(0,0);},
  pClear:function(){if(!confirm('确定清空全部练习记录？错题本和收藏不受影响。'))return;sset('rec',{});var f=pList();sdel(pKey());view={};closeSheet();render();toast('已清空');},
  rsTopic:function(t){var st=view.rs;var i=st.topics.indexOf(t);if(i<0)st.topics.push(t);else st.topics.splice(i,1);sset('rsTopics',st.topics);render();},
  rsType:function(t){view.rs.type=t;render();},
  rsReset:function(){view.rs.topics=[];sset('rsTopics',[]);render();},
  rsN:function(n){view.rs.n=+n;sset('rsN',+n);render();},
  rsStart:function(){var st=view.rs;var pool=Q.filter(function(q){return (!st.topics.length||st.topics.indexOf(q.topic)>=0)&&(!st.type||q.type===st.type);});var n=Math.max(1,Math.min(st.n,pool.length));
    sset('ses.random',newSession(shuffle(pool).slice(0,n).map(function(q){return q.id;})));sset('rsLast',{topics:st.topics,type:st.type,n:n});go('#/random/run');},
  rsAgain:function(){var L=sget('rsLast',{topics:[],type:'',n:20});view.rs={topics:L.topics,type:L.type,n:L.n};A.rsStart();},
  sSubmit:function(){sAnswer(function(a){a.revealed=true;});},
  sView:function(){sAnswer(function(a){a.revealed=true;a.viewed=true;});},
  sMove:function(d){var k=view.s.key;var ses=sget(k,null);ses.idx=Math.max(0,ses.idx+(+d));sset(k,ses);render();window.scrollTo(0,0);},
  sQuit:function(){var k=view.s.key;var ses=sget(k,null);if(!confirm('结束本组练习，直接看结果？'))return;ses.idx=ses.ids.length;sset(k,ses);render();},
  bookRun:function(w){var ids=(w==='fav'?favs():wrongs()).filter(function(id){return QBY[id];});if(!ids.length)return;sset('ses.book-'+w,newSession(shuffle(ids)));go('#/book/'+w+'/run');},
  bookDel:function(x){var p=x.split(':');var id=+p[1];if(p[0]==='fav')toggleFav(id);else delWrong(id);render();},
  bookClear:function(w){if(!confirm(w==='fav'?'确定清空全部收藏？':'确定清空错题本？'))return;sset(w==='fav'?'fav':'wrong',[]);render();toast('已清空');},
  examStart:function(){var ses=sget('ses.exam',null);if(ses&&!ses.done&&Date.now()-ses.start<EXAM_SEC*1000&&!confirm('有一场考试还没交卷，确定放弃并重新开始？'))return;examStart();},
  eMove:function(d){var ses=sget('ses.exam',null);ses.idx=Math.max(0,Math.min(ses.ids.length-1,ses.idx+(+d)));sset('ses.exam',ses);render();window.scrollTo(0,0);},
  eJump:function(i){var ses=sget('ses.exam',null);ses.idx=+i;sset('ses.exam',ses);render();},
  eSubmit:function(){var ses=sget('ses.exam',null);var left=ses.ids.filter(function(x){return !(ses.ans[x]&&ses.ans[x].sel.length);}).length;
    if(!confirm(left?'还有 '+left+' 题没作答，确定交卷？':'确定交卷？'))return;examSubmit(false);},
  practiceTopic:function(t){sset('pFilter',{topics:[t],type:''});go('#/practice');},
  examRedoWrong:function(i){var x=sget('examHist',[])[+i];if(!x)return;var ids=x.detail.filter(function(d){return d.pts<10;}).map(function(d){return d.id;});sset('ses.random',newSession(shuffle(ids)));go('#/random/run');},
  fShow:function(i){view.fv[i]=true;render();},
  dStart:function(){view.d.started=true;view.d.focus=true;render();},
  dReveal:function(){var d=view.d;var c=CASES.filter(function(x){return x.no===d.no;})[0];var txt=(d.draft||'').trim();if(txt)d.typed[d.cur]=txt;d.draft='';d.cur++;
    while(d.cur<c.dialog.length&&c.dialog[d.cur].who==='doc')d.cur++;d.scroll=true;render();
    var msgs=document.querySelectorAll('.chat .msg');var lastDoc=null;for(var i=msgs.length-1;i>=0;i--){if(msgs[i].classList.contains('doc')){lastDoc=msgs[i];break;}}
    var coach=document.querySelector('.coach')||document.getElementById('drill-end');if(coach)coach.scrollIntoView({block:'end',behavior:'smooth'});},
  dRestart:function(){var no=view.d.no;view.d={no:no,cur:0,typed:{},started:true};render();window.scrollTo(0,0);},
  dFinish:function(s){var d=view.d;var all=sget('rpDone',{});var x=all[d.no]||{n:0};x.n++;x.t=Date.now();x.last=s;all[d.no]=x;sset('rpDone',all);toast('已记录，第 '+x.n+' 次');render();},
  speak:function(t){speak(t);},
  resetAll:function(){if(!confirm('确定清空本机全部练习记录、错题本、收藏、考试成绩和演练记录？此操作不能撤销。'))return;['rec','wrong','fav','examHist','rpDone','ses.exam','ses.random','ses.book-wrong','ses.book-fav','pFilter','rsTopics','rsN','rsLast'].forEach(sdel);
    try{Object.keys(localStorage).forEach(function(k){if(k.indexOf(NS+'pPos.')===0)localStorage.removeItem(k);});}catch(e){}toast('已清空');go('#/');}
};
render();
})();
